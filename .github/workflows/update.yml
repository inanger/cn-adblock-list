name: update-list

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Merge upstream lists
        run: python merge.py

      - name: Publish to repo root
        run: |
          cp merged/adblock-merged.txt adblock-merged.txt
          cp merged/stats.md stats.md

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add adblock-merged.txt stats.md
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "chore: update list $(date -u +%Y-%m-%d)"
            git push
          fi
